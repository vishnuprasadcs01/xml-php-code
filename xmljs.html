<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UBL XML Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/xmlbuilder2/lib/index.min.js"></script>
  </head>
  <body>
    <h1>Check the browser console (F12) to see the generated XML</h1>

    <script>
      // In the browser, xmlbuilder2 exposes a global object named 'xmlbuilder2'
      const { create } = xmlbuilder2;

      // 1. Initialize the root element with all standard ZATCA / UBL namespaces
      const root = create({ version: "1.0", encoding: "UTF-8" }).ele(
        "Invoice",
        {
          xmlns: "urn:oasis:names:specification:ubl:schema:xsd:Invoice-2",
          "xmlns:cac":
            "urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2",
          "xmlns:cbc":
            "urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2",
          "xmlns:ext":
            "urn:oasis:names:specification:ubl:schema:xsd:CommonExtensionComponents-2",
        },
      );

      // 2. Build ext:UBLExtensions (Contains the cryptographic digital signature)
      const extensions = root.ele("ext:UBLExtensions").ele("ext:UBLExtension");
      extensions
        .ele("ext:ExtensionURI")
        .txt("urn:oasis:names:specification:ubl:dsig:enveloped:xades");

      const sigInfo = extensions
        .ele("ext:ExtensionContent")
        .ele("sig:UBLDocumentSignatures", {
          "xmlns:sig":
            "urn:oasis:names:specification:ubl:schema:xsd:CommonSignatureComponents-2",
          "xmlns:sac":
            "urn:oasis:names:specification:ubl:schema:xsd:SignatureAggregateComponents-2",
          "xmlns:sbc":
            "urn:oasis:names:specification:ubl:schema:xsd:SignatureBasicComponents-2",
        })
        .ele("sac:SignatureInformation");

      sigInfo
        .ele("cbc:ID")
        .txt("urn:oasis:names:specification:ubl:signature:1");
      sigInfo
        .ele("sbc:ReferencedSignatureID")
        .txt("urn:oasis:names:specification:ubl:signature:Invoice");

      // Cryptographic ds:Signature payload
      const dsSignature = sigInfo.ele("ds:Signature", {
        "xmlns:ds": "http://www.w3.org/2000/09/xmldsig#",
        Id: "signature",
      });
      const dsSignedInfo = dsSignature.ele("ds:SignedInfo");
      dsSignedInfo.ele("ds:CanonicalizationMethod", {
        Algorithm: "http://www.w3.org/2006/12/xml-c14n11",
      });
      dsSignedInfo.ele("ds:SignatureMethod", {
        Algorithm: "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256",
      });

      // ds:Reference 1 (Invoice structural hash exemptions)
      const ref1 = dsSignedInfo.ele("ds:Reference", {
        Id: "invoiceSignedData",
        URI: "",
      });
      const transforms = ref1.ele("ds:Transforms");
      transforms
        .ele("ds:Transform", {
          Algorithm: "http://www.w3.org/TR/1999/REC-xpath-19991116",
        })
        .ele("ds:XPath")
        .txt("not(//ancestor-or-self::ext:UBLExtensions)");
      transforms
        .ele("ds:Transform", {
          Algorithm: "http://www.w3.org/TR/1999/REC-xpath-19991116",
        })
        .ele("ds:XPath")
        .txt("not(//ancestor-or-self::cac:Signature)");
      transforms
        .ele("ds:Transform", {
          Algorithm: "http://www.w3.org/TR/1999/REC-xpath-19991116",
        })
        .ele("ds:XPath")
        .txt(
          "not(//ancestor-or-self::cac:AdditionalDocumentReference[cbc:ID='QR'])",
        );
      transforms.ele("ds:Transform", {
        Algorithm: "http://www.w3.org/2006/12/xml-c14n11",
      });
      ref1.ele("ds:DigestMethod", {
        Algorithm: "http://www.w3.org/2001/04/xmlenc#sha256",
      });
      ref1
        .ele("ds:DigestValue")
        .txt("V4U5qlZ3yXQ/Si1AC/R8SLc3F+iNy27wdVe8IWRqFAQ=");

      // ds:Reference 2 (XadES properties hash)
      const ref2 = dsSignedInfo.ele("ds:Reference", {
        Type: "http://www.w3.org/2000/09/xmldsig#SignatureProperties",
        URI: "#xadesSignedProperties",
      });
      ref2.ele("ds:DigestMethod", {
        Algorithm: "http://www.w3.org/2001/04/xmlenc#sha256",
      });
      ref2
        .ele("ds:DigestValue")
        .txt(
          "ODQwNTg1NTBhMjMzM2YxY2ZkZjVkYzdlNTZiZjY0ODJjMjNkYWI4MTUzNjdmNDVjMjAwZTBjODc2YTNhMWQ1Ng==",
        );

      // Signature Value & Key Metadata
      dsSignature
        .ele("ds:SignatureValue")
        .txt(
          "MEUCIBxyR8rc4K8728wdSF4XSDqPs+rIL+3TFh9m+aNxQPtSAiEA6cHapItvp13yMSu66NbOg2CpomHwUSnYJ9h6uGQ65aY=",
        );
      dsSignature
        .ele("ds:KeyInfo")
        .ele("ds:X509Data")
        .ele("ds:X509Certificate")
        .txt(
          "MIID3jCCA4SgAwIBAgITEQAAOAPF90Ajs/xcXwABAAA4AzAKBggqhkjOPQQDAjBiMRUwEwYKCZImiZPyLGQBGRYFbG9jYWwxEzARBgoJkiaJk/IsZAEZFgNnb3YxFzAVBgoJkiaJk/IsZAEZFgdleHRnYXp0MRswGQYDVQQDExJQUlpFSU5WT0lDRVNDQTQtQ0EwHhcNMjQwMTExMDkxOTMwWhcNMjkwMTA5MDkxOTMwWjB1MQswCQYDVQQGEwJTQTEmMCQGA1UEChMdTWF4aW11bSBTcGVlZCBUZWNoIFN1cHBseSBMVEQxFjAUBgNVBAsTDVJpeWFkaCBCcmFuY2gxJjAkBgNVBAMTHVRTVC04ODY0MzExNDUtMzk5OTk5OTk5OTAwMDAzMFYwEAYHKoZIzj0CAQYFK4EEAAoDQgAEoWCKa0Sa9FIErTOv0uAkC1VIKXxU9nPpx2vlf4yhMejy8c02XJblDq7tPydo8mq0ahOMmNo8gwni7Xt1KT9UeKOCAgcwggIDMIGtBgNVHREEgaUwgaKkgZ8wgZwxOzA5BgNVBAQMMjEtVFNUfDItVFNUfDMtZWQyMmYxZDgtZTZhMi0xMTE4LTliNTgtZDlhOGYxMWU0NDVmMR8wHQYKCZImiZPyLGQBAQwPMzk5OTk5OTk5OTAwMDAzMQ0wCwYDVQQMDAQxMTAwMREwDwYDVQQaDAhSUlJEMjkyOTEaMBgGA1UEDwwRU3VwcGx5IGFjdGl2aXRpZXMwHQYDVR0OBBYEFEX+YvmmtnYoDf9BGbKo7ocTKYK1MB8GA1UdIwQYMBaAFJvKqqLtmqwskIFzVvpP2PxT+9NnMHsGCCsGAQUFBwEBBG8wbTBrBggrBgEFBQcwAoZfaHR0cDovL2FpYTQuemF0Y2EuZ292LnNhL0NlcnRFbnJvbGwvUFJaRUludm9pY2VTQ0E0LmV4dGdhenQuZ292LmxvY2FsX1BSWkVJTlZPSUNFU0NBNC1DQSgxKS5jcnQwDgYDVR0PAQH/BAQDAgeAMDwGCSsGAQQBgjcVBwQvMC0GJSsGAQQBgjcVCIGGqB2E0PsShu2dJIfO+xnTwFVmh/qlZYXZhD4CAWQCARIwHQYDVR0lBBYwFAYIKwYBBQUHAwMGCCsGAQUFBwMCMCcGCSsGAQQBgjcVCgQaMBgwCgYIKwYBBQUHAwMwCgYIKwYBBQUHAwIwCgYIKoZIzj0EAwIDSAAwRQIhALE/ichmnWXCUKUbca3yci8oqwaLvFdHVjQrveI9uqAbAiA9hC4M8jgMBADPSzmd2uiPJA6gKR3LE03U75eqbC/rXA==",
        );

      // ds:Object (Qualifying Properties / Signing Time)
      const xades = dsSignature
        .ele("ds:Object")
        .ele("xades:QualifyingProperties", {
          "xmlns:xades": "http://uri.etsi.org/01903/v1.3.2#",
          Target: "signature",
        });
      const signedProps = xades
        .ele("xades:SignedProperties", { Id: "xadesSignedProperties" })
        .ele("xades:SignedSignatureProperties");
      signedProps.ele("xades:SigningTime").txt("2024-01-14T10:21:40");
      const cert = signedProps
        .ele("xades:SigningCertificate")
        .ele("xades:Cert");
      cert
        .ele("xades:CertDigest")
        .ele("ds:DigestMethod", {
          Algorithm: "http://www.w3.org/2001/04/xmlenc#sha256",
        })
        .up()
        .ele("ds:DigestValue")
        .txt(
          "ZDMwMmI0MTE1NzVjOTU2NTk4YzVlODhhYmI0ODU2NDUyNTU2YTVhYjhhMDFmN2FjYjk1YTA2OWQ0NjY2MjQ4NQ==",
        );
      cert
        .ele("xades:IssuerSerial")
        .ele("ds:X509IssuerName")
        .txt("CN=PRZEINVOICESCA4-CA, DC=extgazt, DC=gov, DC=local")
        .up()
        .ele("ds:X509SerialNumber")
        .txt("379112742831380471835263969587287663520528387");

      // 3. Document Level Metadata
      root.ele("cbc:ProfileID").txt("reporting:1.0");
      root.ele("cbc:ID").txt("SME00023");
      root.ele("cbc:UUID").txt("8d487816-70b8-4ade-a618-9d620b73814a");
      root.ele("cbc:IssueDate").txt("2022-09-07");
      root.ele("cbc:IssueTime").txt("12:21:28");
      root.ele("cbc:InvoiceTypeCode", { name: "0100000" }).txt("388");
      root.ele("cbc:DocumentCurrencyCode").txt("SAR");
      root.ele("cbc:TaxCurrencyCode").txt("SAR");

      // 4. Additional Document References (ICV, PIH, QR Code)
      root
        .ele("cac:AdditionalDocumentReference")
        .ele("cbc:ID")
        .txt("ICV")
        .up()
        .ele("cbc:UUID")
        .txt("23");

      root
        .ele("cac:AdditionalDocumentReference")
        .ele("cbc:ID")
        .txt("PIH")
        .up()
        .ele("cac:Attachment")
        .ele("cbc:EmbeddedDocumentBinaryObject", { mimeCode: "text/plain" })
        .txt(
          "NWZlY2ViNjZmZmM4NmYzOGQ5NTI3ODZjNmQ2OTZjNzljMmRiYzIzOWRkNGU5MWI0NjcyOWQ3M2EyN2ZiNTdlOQ==",
        );

      root
        .ele("cac:AdditionalDocumentReference")
        .ele("cbc:ID")
        .txt("QR")
        .up()
        .ele("cac:Attachment")
        .ele("cbc:EmbeddedDocumentBinaryObject", { mimeCode: "text/plain" })
        .txt(
          "AW/YtNix2YPYqSDYqtmI2LHZitivINin2YTYqtmD2YbZiNmE2YjYrNmK2Kcg2KjYo9mC2LXZiSDYs9ix2LnYqSDYp9mE2YXYrdiv2YjYr9ipIHwgTWF4aW11bSBTcGVlZCBUZWNoIFN1cHBseSBMVEQCDzM5OTk5OTk5OTkwMDAwMwMTMjAyMi0wOS0wN1QxMjoyMToyOAQENC42MAUDMC42BixmKzBXQ3FuUGtJbkkrZUw5RzNMQXJ5MTJmVFBmK3RvQzlVWDA3RjRmSStzPQdgTUVVQ0lCeHlSOHJjNEs4NzI4d2RTRjRYU0RxUHMrcklMKzNURmg5bSthTnhRUHRTQWlFQTZjSGFwSXR2cDEzeU1TdTY2TmJPZzJDcG9tSHdVU25ZSjloNnVHUTY1YVk9CFgwVjAQBgcqhkjOPQIBBgUrgQQACgNCAAShYIprRJr0UgStM6/S4CQLVUgpfFT2c+nHa+V/jKEx6PLxzTZcluUOru0/J2jyarRqE4yY2jyDCeLte3UpP1R4",
        );

      // 5. Signature Association
      root
        .ele("cac:Signature")
        .ele("cbc:ID")
        .txt("urn:oasis:names:specification:ubl:signature:Invoice")
        .up()
        .ele("cbc:SignatureMethod")
        .txt("urn:oasis:names:specification:ubl:dsig:enveloped:xades");

      // 6. Accounting Parties (Supplier and Customer)
      const supplier = root.ele("cac:AccountingSupplierParty").ele("cac:Party");
      supplier
        .ele("cac:PartyIdentification")
        .ele("cbc:ID", { schemeID: "CRN" })
        .txt("1010010000");
      const sAddr = supplier.ele("cac:PostalAddress");
      sAddr.ele("cbc:StreetName").txt("الامير سلطان | Prince Sultan");
      sAddr.ele("cbc:BuildingNumber").txt("2322");
      sAddr.ele("cbc:CitySubdivisionName").txt("المربع | Al-Murabba");
      sAddr.ele("cbc:CityName").txt("الرياض | Riyadh");
      sAddr.ele("cbc:PostalZone").txt("23333");
      sAddr.ele("cac:Country").ele("cbc:IdentificationCode").txt("SA");
      supplier
        .ele("cac:PartyTaxScheme")
        .ele("cbc:CompanyID")
        .txt("399999999900003")
        .up()
        .ele("cac:TaxScheme")
        .ele("cbc:ID")
        .txt("VAT");
      supplier
        .ele("cac:PartyLegalEntity")
        .ele("cbc:RegistrationName")
        .txt(
          "شركة توريد التكنولوجيا بأقصى سرعة المحدودة | Maximum Speed Tech Supply LTD",
        );

      const customer = root.ele("cac:AccountingCustomerParty").ele("cac:Party");
      const cAddr = customer.ele("cac:PostalAddress");
      cAddr.ele("cbc:StreetName").txt("صلاح الدين | Salah Al-Din");
      cAddr.ele("cbc:BuildingNumber").txt("1111");
      cAddr.ele("cbc:CitySubdivisionName").txt("المروج | Al-Murooj");
      cAddr.ele("cbc:CityName").txt("الرياض | Riyadh");
      cAddr.ele("cbc:PostalZone").txt("12222");
      cAddr.ele("cac:Country").ele("cbc:IdentificationCode").txt("SA");
      customer
        .ele("cac:PartyTaxScheme")
        .ele("cbc:CompanyID")
        .txt("399999999800003")
        .up()
        .ele("cac:TaxScheme")
        .ele("cbc:ID")
        .txt("VAT");
      customer
        .ele("cac:PartyLegalEntity")
        .ele("cbc:RegistrationName")
        .txt("شركة نماذج فاتورة المحدودة | Fatoora Samples LTD");

      // 7. Delivery & Payment Terms
      root.ele("cac:Delivery").ele("cbc:ActualDeliveryDate").txt("2022-09-07");
      root.ele("cac:PaymentMeans").ele("cbc:PaymentMeansCode").txt("10");

      // 8. Global Allowance Charge (Discount block)
      const globalAllowance = root.ele("cac:AllowanceCharge");
      globalAllowance.ele("cbc:ChargeIndicator").txt("false");
      globalAllowance.ele("cbc:AllowanceChargeReason").txt("discount");
      globalAllowance.ele("cbc:Amount", { currencyID: "SAR" }).txt("0.00");
      const gaTaxCat = globalAllowance.ele("cac:TaxCategory");
      gaTaxCat
        .ele("cbc:ID", { schemeID: "UN/ECE 5305", schemeAgencyID: "6" })
        .txt("S");
      gaTaxCat.ele("cbc:Percent").txt("15");
      gaTaxCat
        .ele("cac:TaxScheme")
        .ele("cbc:ID", { schemeID: "UN/ECE 5153", schemeAgencyID: "6" })
        .txt("VAT");

      // 9. Tax Breakdown Totals
      root
        .ele("cac:TaxTotal")
        .ele("cbc:TaxAmount", { currencyID: "SAR" })
        .txt("0.6");

      const taxTotal2 = root.ele("cac:TaxTotal");
      taxTotal2.ele("cbc:TaxAmount", { currencyID: "SAR" }).txt("0.6");
      const taxSubtotal = taxTotal2.ele("cac:TaxSubtotal");
      taxSubtotal.ele("cbc:TaxableAmount", { currencyID: "SAR" }).txt("4.00");
      taxSubtotal.ele("cbc:TaxAmount", { currencyID: "SAR" }).txt("0.60");
      const tsTaxCat = taxSubtotal.ele("cac:TaxCategory");
      tsTaxCat
        .ele("cbc:ID", { schemeID: "UN/ECE 5305", schemeAgencyID: "6" })
        .txt("S");
      tsTaxCat.ele("cbc:Percent").txt("15.00");
      tsTaxCat
        .ele("cac:TaxScheme")
        .ele("cbc:ID", { schemeID: "UN/ECE 5153", schemeAgencyID: "6" })
        .txt("VAT");

      // 10. Legal Monetary Totals
      const monetaryTotal = root.ele("cac:LegalMonetaryTotal");
      monetaryTotal
        .ele("cbc:LineExtensionAmount", { currencyID: "SAR" })
        .txt("4.00");
      monetaryTotal
        .ele("cbc:TaxExclusiveAmount", { currencyID: "SAR" })
        .txt("4.00");
      monetaryTotal
        .ele("cbc:TaxInclusiveAmount", { currencyID: "SAR" })
        .txt("4.60");
      monetaryTotal
        .ele("cbc:AllowanceTotalAmount", { currencyID: "SAR" })
        .txt("0.00");
      monetaryTotal.ele("cbc:PrepaidAmount", { currencyID: "SAR" }).txt("0.00");
      monetaryTotal.ele("cbc:PayableAmount", { currencyID: "SAR" }).txt("4.60");

      // 11. Invoice Line Items
      const line = root.ele("cac:InvoiceLine");
      line.ele("cbc:ID").txt("1");
      line.ele("cbc:InvoicedQuantity", { unitCode: "PCE" }).txt("2.000000");
      line.ele("cbc:LineExtensionAmount", { currencyID: "SAR" }).txt("4.00");
      line
        .ele("cac:TaxTotal")
        .ele("cbc:TaxAmount", { currencyID: "SAR" })
        .txt("0.60")
        .up()
        .ele("cbc:RoundingAmount", { currencyID: "SAR" })
        .txt("4.60");

      const item = line.ele("cac:Item");
      item.ele("cbc:Name").txt("قلم رصاص");
      const itemTaxCat = item.ele("cac:ClassifiedTaxCategory");
      itemTaxCat.ele("cbc:ID").txt("S");
      itemTaxCat.ele("cbc:Percent").txt("15.00");
      itemTaxCat.ele("cac:TaxScheme").ele("cbc:ID").txt("VAT");

      line
        .ele("cac:Price")
        .ele("cbc:PriceAmount", { currencyID: "SAR" })
        .txt("2.00");

      // 12. Output as Formatted XML string
      const xmlString = root.end({ prettyPrint: true });
      console.log(xmlString);
    </script>
  </body>
